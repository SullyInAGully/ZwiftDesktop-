syntax = "proto3";

message PlayerState {
  int32 athleteId = 1;
  uint64 worldTime = 2;
  int32 distance = 3;
  int32 roadTime = 4;
  int32 laps = 5;
  int32 speedUph = 6;
  int32 acceleration = 7;
  int32 roadPosition = 8;
  int32 cadenceUHz = 9;
  int32 draft = 10;
  int32 heartrate = 11;
  int32 power = 12;
  int32 headingMicroradians = 13;
  int32 lean = 14;
  int32 climbing = 15;
  int32 time = 16;
  int32 animationState = 17;
  uint32 flags1 = 19;
  uint32 flags2 = 20;
  uint32 progressRaw = 21;
  int64 profileUpdatedAt = 22;
  bool justWatching = 23;
  int32 milliWattHours = 24;
  float x = 25;
  float z = 26;
  float y = 27;
  int32 watchingAthleteId = 28;
  int32 eventSubgroupId = 29;
  int32 sport = 31;
  int32 timeGap = 33;
  float eventDistanceCm = 34;
  int32 courseId = 35;
  int32 routeCheckpointIndex = 36;
  int32 routeDecisionIndex = 37;
  bool canSteer = 38;
  uint32 routeId = 39;
  bool activeSteer = 41;
  bool portal = 43;
  int32 portalGradientScale = 44;
  int32 portalElevationScale = 45;
}

message ClientCapabilities {
  bool orientation = 1;
  bool headphones = 2;
}

message ClientInfo {
  string appVersion = 1;
  string osVersion = 2;
  string platform = 3;
  string deviceModel = 4;
  ClientCapabilities capabilities = 5;
  string locale = 6;
  int32 actionBarVersion = 7;
}

message ClientAction {
  enum Type {
    UNSET = 0;
    RIDE_ON_GIVEN = 1;
    SAVE_ACTIVITY_PREVIEW = 2;
    SAVE_ACTIVITY_FINAL = 3;
    DISCARD_ACTIVITY = 4;
    START_CONNECTED_SESSION = 5;
    EXIT_GAME = 6;
    START_ZWIFTING = 7;
    DISMISS_EXIT_GAME = 8;
    PROMPT_EXIT_GAME = 9;
    ACTION_BAR_OPEN = 10;
    ACTION_BAR_CLOSE = 11;
    END_CONNECTED_SESSION = 12;
  }
  Type type = 1;
  int32 athleteId = 2;
}

message GamePacket {
  enum Type {
    UNKNOWN = 0;
    CLIENT_INFO = 4;
    CLIENT_ACTION = 15;
  }
  Type type = 1;
  ClientInfo clientInfo = 5;
  ClientAction clientAction = 16;
}

message CompanionToGameCommand {
  enum Type {
    UNKNOWN = 0;
    PAIRING_AS = 28;
    PHONE_TO_GAME_PACKET = 29;
  }
  int32 seqno = 1;
  Type type = 2;
  int64 athleteId = 19;
  GamePacket gamePacket = 21;
}

message CompanionToGame {
  int32 athleteId = 1;
  repeated CompanionToGameCommand commands = 2;
  int32 seqno = 10;
}

message GameToCompanion {
  int32 seqno = 1;
  int32 largestCommandSeqno = 2;
  int32 athleteId = 3;
  int32 realm = 4;
  PlayerState playerState = 5;
  bool teleportingAllowed = 6;
  bool useMetric = 7;
  float grade = 10;
  uint64 worldTime = 12;
}
